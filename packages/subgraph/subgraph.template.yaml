specVersion: 0.0.4
description: Tenderize V2 Subgraph
repository: https://github.com/Tenderize/tenderize/monorepo
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Registry
    network: '{{ networkName }}'
    source:
      startBlock: {{ startBlock }}
      address: '{{ registry }}'
      abi: Registry
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/mappings/registry.ts
      entities:
        - Asset
        - Tenderizer
      abis:
        - name: Registry
          file: ./abis/Registry.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: NewTenderizer(indexed address,indexed address,address)
          handler: handleNewTenderizer

  - kind: ethereum/contract
    name: Unlocks
    network: '{{ networkName }}'
    source:
      startBlock: {{ startBlock }}
      address: '{{ unlocks }}'
      abi: Unlocks
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/mappings/unlocks.ts
      entities:
        - User
        - Unlock
      abis:
        - name: Unlocks
          file: ./abis/Unlocks.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleUnlockTransfer

  - kind: ethereum/contract
    name: SwapFactory
    network: '{{ networkName }}'
    source:
      startBlock: {{ swapStartBlock }}
      address: '{{ swapFactory }}'
      abi: SwapFactory
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/mappings/swapFactory.ts
      entities:
        - SwapPool
      abis:
        - name: SwapFactory
          file: ./abis/SwapFactory.json
        - name: TenderSwap
          file: ./abis/TenderSwap.json
      eventHandlers:
        - event: SwapDeployed(address,address,address)
          handler: handleNewSwapPool

{{#ifEquals networkName "arbitrum-one"}}
  - kind: ethereum/contract
    name: MultiValidatorLST_Livepeer
    network: '{{ networkName }}'
    source:
      startBlock: {{ multiLivepeerStartBlock }}
      address: '0x388b0faf9de300ffc21e3dc849202544901792cb'
      abi: MultiValidatorLST
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/mappings/multivalidator.ts
      entities:
        - Deposit
        - Unstake
        - Withdraw
        - MultiValidator
        - MultiValidatorUnstake
        - MultiValidatorStake
        - MultiValidatorDeposit
        - MultiValidatorWithdraw
        - User
      abis:
        - name: MultiValidatorLST
          file: ./abis/MultiValidatorLST.json
      eventHandlers:
        - event: Deposit(indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Unstake(indexed address,uint256,uint256,uint256)
          handler: handleUnstake
        - event: Withdraw(indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: ValidatorAdded(indexed uint256,address,uint256)
          handler: handleValidatorAdded
        - event: ValidatorRemoved(indexed uint256)
          handler: handleValidatorRemoved
        - event: WeightsUpdated(uint256[],uint256[])
          handler: handleWeightsUpdated

  - kind: ethereum/contract
    name: MultiValidatorLST_Graph
    network: '{{ networkName }}'
    source:
      startBlock: {{ multiGraphStartBlock }}
      address: '0x9f5540f4a9777ea678d80a7b508dcd924a4b1187'
      abi: MultiValidatorLST
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/mappings/multivalidator.ts
      entities:
        - Deposit
        - Unstake
        - Withdraw
        - MultiValidator
        - MultiValidatorUnstake
        - MultiValidatorStake
        - MultiValidatorDeposit
        - MultiValidatorWithdraw
        - User
      abis:
        - name: MultiValidatorLST
          file: ./abis/MultiValidatorLST.json
      eventHandlers:
        - event: Deposit(indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Unstake(indexed address,uint256,uint256,uint256)
          handler: handleUnstake
        - event: Withdraw(indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: ValidatorAdded(indexed uint256,address,uint256)
          handler: handleValidatorAdded
        - event: ValidatorRemoved(indexed uint256)
          handler: handleValidatorRemoved
        - event: WeightsUpdated(uint256[],uint256[])
          handler: handleWeightsUpdated
{{/ifEquals}}

templates:
  - name: Tenderizer
    kind: ethereum/contract
    network: '{{ networkName }}'
    source:
      abi: Tenderizer
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/mappings/tenderizer.ts
      entities:
        - Asset
        - Tenderizer
        - Stake
      abis:
        - name: Tenderizer
          file: ./abis/Tenderizer.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Unlock(indexed address,uint256,uint256)
          handler: handleUnlock
        - event: Withdraw(indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: Rebase(uint256,uint256)
          handler: handleRebase
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer

  - name: SwapPool
    kind: ethereum/contract
    network: '{{ networkName }}'
    source:
      abi: TenderSwap
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/mappings/tenderswap.ts
      entities:
        - SwapPool
      abis:
        - name: TenderSwap
          file: ./abis/TenderSwap.json
        - name: UniswapQuoter
          file: ./abis/UniswapQuoter.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,uint256,uint256,uint256)
          handler: handleSwap
        - event: Deposit(indexed address,uint256,uint256)
          handler: handleSwapDeposit
        - event: Withdraw(indexed address,uint256,uint256)
          handler: handleSwapWithdraw
        - event: UnlockBought(indexed address,uint256,uint256,uint256,uint256)
          handler: handleSwapUnlockBought
        - event: UnlockRedeemed(indexed address,uint256,uint256,uint256,uint256)
          handler: handleSwapUnlockRedeemed

  - name: SwapPoolToken
    kind: ethereum/contract
    network: '{{ networkName }}'
    source:
      abi: ERC20
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/mappings/tenderswap.ts
      entities:
        - SwapPool
        - SwapLPTokenTransfer
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleSwapTokenTransfer
